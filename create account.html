<body>

    <div class="signup-box">

        <h1 class="signup-title">Create Account</h1>

        <p class="signup-subtitle">
            Join Zayn &amp; Mike
        </p>

        <form id="signupForm">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"

                    placeholder="Choose a username"

                >
            </div>

 <div class="form-group">

</div>

                    type="password"

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    /* Firebase configuration */

    const firebaseConfig = {
        apiKey: "AIzaSyAg1mUK15mtqLqUc0QhDQ0m1xinu89-ixY",
        authDomain: "zayn-and-mike.firebaseapp.com",
        projectId: "zayn-and-mike",
        storageBucket: "zayn-and-mike.firebasestorage.app",
        messagingSenderId: "828342529884",
        appId: "1:828342529884:web:edcef0839a640ad8869b99"
    };


    /* Start Firebase */

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    /* Get form */

    const signupForm =
        document.getElementById("signupForm");

    const message =
        document.getElementById("message");


    /* Create account */

    signupForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const username =
            document.getElementById("username").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        /* Check username */

        if (username === "") {

            message.style.color = "#ff5252";
            message.textContent =
                "Please enter a username.";

            return;
        }


        /* Check email */

        if (email === "") {

            message.style.color = "#ff5252";
            message.textContent =
                "Please enter your email.";

            return;
        }


        /* Check password */

        if (password.length < 6) {

            message.style.color = "#ff5252";
            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        /* Check passwords */

        if (password !== confirmPassword) {

            message.style.color = "#ff5252";
            message.textContent =
                "Passwords do not match.";

            return;
        }


        /* Show loading message */

        message.style.color = "#b6ff00";
        message.textContent =
            "Creating your account...";


        try {

            /* Create Firebase account */

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            /*
                Save the username locally.

                Firebase handles the real authentication.
                localStorage only remembers the
                username for the website navbar.
            */

            localStorage.setItem(
                "loggedInUser",
                username
            );


            localStorage.setItem(
                "firebaseUserId",
                user.uid
            );


            /* Success */

            message.style.color = "#b6ff00";

            message.textContent =
                "✓ Account created successfully!";


            /* Go to website */

            setTimeout(function() {

                window.location.href =
                    "xzaynmike.html";

            }, 1000);


        } catch (error) {

            console.error(error);


            message.style.color = "#ff5252";


            if (error.code === "auth/email-already-in-use") {

                message.textContent =
                    "That email is already registered.";

            } else if (error.code === "auth/invalid-email") {

                message.textContent =
                    "Please enter a valid email.";

            } else if (error.code === "auth/weak-password") {

                message.textContent =
                    "Password must be at least 6 characters.";

            } else {

                message.textContent =
                    "Could not create account. Please try again.";

            }

        }

    });

</script>
<script type="module" src="auth.js"></script>

</div>
