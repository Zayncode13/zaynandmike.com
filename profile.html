            <div class="profile-info">

                <div class="info-row">

                    <span class="info-label">
                        Username
                    </span>

                    <span
                        class="info-value"
                        id="username">
                        Loading...
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Email
                    </span>

                    <span
                        class="info-value"
                        id="email">
                        Loading...
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Account Status
                    </span>

                    <span
                        class="info-value status">
                        Signed In ✓
                    </span>

                </div>

            </div>


            <button
                class="logout-btn"
                id="logoutBtn">
                LOG OUT
            </button>


            <a

                class="back-link">

    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyAg1mUK15mtpqLqUc0QhDQ0m1xinu89-ixY",

            authDomain: "zayn-and-mike.firebaseapp.com",

            projectId: "zayn-and-mike",

            storageBucket: "zayn-and-mike.firebasestorage.app",

            messagingSenderId: "828342529884",

            appId: "1:828342529884:web:edcef0839a640ad8869b99"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const usernameElement =
            document.getElementById("username");

        const emailElement =
            document.getElementById("email");

        const logoutBtn =
            document.getElementById("logoutBtn");


        /* Check Firebase login */

        onAuthStateChanged(auth, function(user) {

            if (!user) {

                window.location.href =
                    "xzaynmike.html";

                return;
            }


            /* Show email */

            emailElement.textContent =
                user.email || "No email";


            /*
                Show the username saved
                during account creation.
            */

            const savedUsername =
                localStorage.getItem("loggedInUser");


            usernameElement.textContent =
                savedUsername || "User";

        });


        /* LOG OUT */

        logoutBtn.addEventListener("click", async function() {

            try {

                await signOut(auth);

                localStorage.removeItem("loggedInUser");

                localStorage.removeItem("firebaseUserId");

                window.location.href =
                    "xzaynmike.html";

            } catch (error) {

                console.error(error);

                alert("Could not log out. Please try again.");

            }

        });

    </script>


    <!-- SHARED AUTH -->

    <script type="module" src="auth.js"></script>

</body>
